name: Daily Chicken Rates Scraper

on:
  schedule:
    # 8:30 AM IST (Indian Standard Time = UTC + 5:30) -> 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    name: Scrape & Update AP & TS Chicken Rates

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; else pip install -r scraper/requirements.txt; fi

      - name: Run Daily Scraper & Update Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -f "scrape_rates.py" ]; then python scrape_rates.py; else python scraper/scrape_rates.py; fi
